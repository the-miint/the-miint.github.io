name: Build & deploy site

on:
  # Deploy when the umbrella site changes
  push:
    branches: [main]
  # Manual trigger
  workflow_dispatch:
  # Nightly rebuild so changes to synced project docs (duckdb-miint) show up
  # even without a push here. Token-free fallback; ~24h worst-case staleness.
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (off the top of the hour to avoid delays)
  # Let a project repo (e.g. duckdb-miint) trigger a rebuild when its docs change.
  # In the project repo, POST a repository_dispatch with event_type: docs-updated.
  repository_dispatch:
    types: [docs-updated]

# Only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync duckdb-miint docs (clones the source repo)
        run: bash scripts/sync-duckdb-miint-docs.sh

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
